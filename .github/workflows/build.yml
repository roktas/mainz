name: Check and publish Mainz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BUNDLE_PATH: ${{ github.workspace }}/.local/var/ruby
      BUNDLE_APP_CONFIG: ${{ github.workspace }}/.local/var/ruby
      MAINZ_QPDF_SOURCE: ${{ github.workspace }}/.local/src/qpdf
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.local/var/cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qpdf/qpdf
          ref: 4eba95899886e851cc41d76886483b347612f2a8
          path: .local/src/qpdf
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emscripten-core/emsdk
          ref: e566f7bdcc7735f44037911c24b87a58a3c93145
          path: .local/var/cpp/emsdk
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang-22 clang-format-22 clang-tidy-22 cmake libjpeg-dev libssl-dev make poppler-utils python3 qpdf zlib1g-dev libcairo2-dev librsvg2-dev librsvg2-bin libxml2-dev libpango1.0-dev libfontconfig1-dev pkg-config
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      - name: Cache Ruby dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/var/ruby
          key: ruby-ubuntu-26.04-${{ runner.arch }}-${{ hashFiles('.ruby-version', 'Gemfile.lock') }}
      - name: Install Ruby check dependencies
        run: bundle install
      - name: Cache compiler output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/var/cache/ccache
          key:
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json',
            '.github/workflows/build.yml') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', '.github/workflows/build.yml') }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Emscripten tools and ports
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .local/var/cpp/emsdk/upstream
            .local/var/cpp/emsdk/node
          key:
            emsdk-${{ runner.os }}-${{ runner.arch }}-6.0.10-${{ hashFiles('.local/var/cpp/emsdk/emsdk_manifest.json',
            '.local/var/cpp/emsdk/emsdk.py') }}
      - name: Build and check native processor
        run: |
          ccache --zero-stats
          bundle exec rake build:native test:native
      - name: Check sanitized processor
        run: bundle exec rake build:sanitize test:sanitize
      - name: Build WASM and check native parity
        shell: bash
        run: |
          set -Eeuo pipefail
          .local/var/cpp/emsdk/emsdk install 6.0.10
          .local/var/cpp/emsdk/emsdk activate 6.0.10
          source .local/var/cpp/emsdk/emsdk_env.sh
          bundle exec rake build:wasm test:wasm
      - name: Report compiler cache use
        run: ccache --show-stats
      - name: Package WASM consumer files
        env:
          MAINZ_REVISION: ${{ github.sha }}
        run: bundle exec rake package:wasm
      - name: Check and build PDF Studio
        run: |
          bundle exec rake setup:web test:web
          npm run format:check
          npm run lint
          npm test
          npm run build
          npm --prefix web exec -- playwright install --with-deps chromium
          npm run test:browser
      - name: Upload PDF Studio for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .local/var/js/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy PDF Studio to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
