<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Select, copy, and arrange PDF pages. Style prepared PDFs on your device." />
    <meta name="theme-color" content="#800080" />
    <style>
      @layer tokens, base, components, layouts, views;
      @layer tokens {
        :root {
          color-scheme: light dark;
        }
        :root[data-theme="light"] {
          color-scheme: light;
        }
        :root[data-theme="dark"] {
          color-scheme: dark;
        }
      }
      @layer base {
        html {
          scrollbar-gutter: stable;
        }
        body {
          margin: 0;
        }
      }
      @layer components {
        @keyframes startup-spin {
          to {
            rotate: 1turn;
          }
        }
        @scope (#startup) {
          :scope {
            display: block grid;
            place-items: center;
            align-content: center;
            box-sizing: border-box;
            min-block-size: 100svb;
            gap: 1rem;
            text-align: center;
          }
          .startup-spinner {
            display: block flow;
            box-sizing: border-box;
            inline-size: 3rem;
            aspect-ratio: 1;
            border: 4px solid color-mix(in oklch, currentColor 20%, transparent);
            border-block-start-color: currentColor;
            border-radius: 50%;
            color: var(--accent, light-dark(oklch(42.0914% 0.193453 328.3634), oklch(83.6851% 0.064657 70.6014)));
            @media (prefers-reduced-motion: no-preference) {
              animation: startup-spin 800ms linear infinite;
            }
          }
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      try {
        const theme = localStorage.getItem("mainz:theme")
        if (["light", "dark"].includes(theme)) document.documentElement.dataset.theme = theme
      } catch {
        /* Use the system theme when storage is unavailable. */
      }
    </script>
    <script>
      window.mainzSupported =
        !!window.CSS &&
        typeof CSS.supports === "function" &&
        CSS.supports("color", "light-dark(white, black)") &&
        CSS.supports("selector(:has(*))") &&
        "showPopover" in HTMLElement.prototype &&
        "toSorted" in Array.prototype
    </script>
    <title>PDF Composer</title>
  </head>
  <body>
    <div id="app">
      <section
        id="startup"
        role="status"
        aria-label="Loading PDF Composer"
        style="
          max-inline-size: 36rem;
          margin: 0 auto;
          padding: 1.5rem;
          font:
            1rem/1.5 system-ui,
            sans-serif;
        "
      >
        <span class="startup-spinner" aria-hidden="true"></span>
      </section>
      <section
        id="unsupported"
        hidden
        style="
          box-sizing: border-box;
          max-width: 36rem;
          margin: 15vh auto;
          padding: 1.5rem;
          font:
            1rem/1.5 system-ui,
            sans-serif;
        "
      >
        <h1>PDF Composer needs a newer system</h1>
        <p id="unsupported-message">This browser or operating system is too old to run PDF Composer.</p>
        <p>
          Update your system and browser, then reopen the application. If updates are unavailable, use a newer device.
        </p>
      </section>
    </div>
    <script>
      if (!window.mainzSupported) {
        document.getElementById("startup").remove()
        const unsupported = document.getElementById("unsupported")
        unsupported.setAttribute("role", "alert")
        unsupported.hidden = false
        const agent = navigator.userAgent
        const ipad = /iPad/.test(agent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        const iphone = /iPhone|iPod/.test(agent)
        if (ipad || iphone)
          document.getElementById("unsupported-message").textContent =
            `This ${ipad ? "iPad" : "iPhone"} needs a newer ${ipad ? "iPadOS" : "iOS"} version to run PDF Composer.`
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
