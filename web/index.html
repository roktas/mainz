<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="PDF Studio" />
    <meta name="theme-color" content="#800080" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      try {
        const theme = localStorage.getItem("mainz:theme");
        if (["light", "dark"].includes(theme)) document.documentElement.dataset.theme = theme;
      } catch {
        /* Use the system theme when storage is unavailable. */
      }
    </script>
    <title>PDF Studio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
